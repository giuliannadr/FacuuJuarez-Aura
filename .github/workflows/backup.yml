name: Backup base de datos

# Corre todos los días a las 06:00 UTC (03:00 hora Argentina)
# También se puede correr a mano desde la pestaña Actions de GitHub.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP=$(date +'%Y-%m-%d_%H%M')
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -f "backup_${STAMP}.sql"
          gzip "backup_${STAMP}.sql"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          ls -lh backup_*.sql.gz

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: backup_*.sql.gz
          # Cuánto tiempo GitHub guarda cada backup antes de borrarlo
          retention-days: 30

      - name: Limpiar tokens de exportación vencidos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -c "DELETE FROM export_tokens WHERE expires_at < NOW();"
